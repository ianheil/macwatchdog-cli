[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macwatchdog"
dynamic = ["version"]
description = "Privacy-focused macOS CLI tool to audit and manage security, privacy, MDM, remote access, and configuration profiles."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ghost" }]
keywords = ["macos", "security", "privacy", "mdm", "audit"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
macwatchdog = "macwatchdog.cli:app"

[project.urls]
Homepage = "https://github.com/"
Issues = "https://github.com/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["macwatchdog*"]

[tool.setuptools.package-data]
macwatchdog = ["VERSION"]

[tool.setuptools.dynamic]
version = { file = ["macwatchdog/VERSION"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
